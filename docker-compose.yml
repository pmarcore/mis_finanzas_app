# Ambiente de pruebas local: API en http://localhost:5080 con su propia base en el volumen finanzas-pruebas.
#   docker compose up -d --build
#   ./scripts/seed-pruebas.sh            # carga la foto de octubre (borra lo que haya)
# Admin de la base (ver y editar tablas): http://localhost:8090, solo desde esta PC.
services:
  api:
    build: ./backend
    ports:
      - "5080:8080"
    volumes:
      - finanzas-pruebas:/data
    restart: unless-stopped

  db-admin:
    image: ghcr.io/coleifer/sqlite-web:latest
    command: ["finanzas.db"]
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - finanzas-pruebas:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  finanzas-pruebas:
