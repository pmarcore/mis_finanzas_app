name: Deploy a Fly.io

# Cada merge a main corre los tests y, si pasan, despliega la API + la app web en Fly.io.
# Necesita el secret FLY_API_TOKEN en el repo (ver docs/despliegue.md). Sin él, el deploy se saltea.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Sin FLY_API_TOKEN no se despliega
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::Falta el secret FLY_API_TOKEN; no se despliega (ver docs/despliegue.md)."
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only
        if: env.FLY_API_TOKEN != ''
